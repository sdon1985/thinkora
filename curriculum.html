<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Practice Sheets — School Curriculum</title><style>body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#142033;margin:0}.page{max-width:1100px;margin:auto;padding:18px}.top{background:#fff;border:1px solid #dfe5ee;border-radius:20px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:16px}.muted{color:#667085}.word{display:inline-block;padding:6px 8px;border:1px solid #dfe5ee;border-radius:8px;margin:3px}.pill{display:inline-block;padding:5px 9px;background:#eef4ff;color:#2563eb;border-radius:999px;font-weight:800;margin:3px;font-size:12px}a{color:#2563eb;text-decoration:none}</style></head><body><div class="page"><div class="top"><h1>🗓️ School Curriculum & Year Schedule</h1><div class="muted">Valley Academy • Third Grade • 2026–2027</div><p><a href="index.html">← Back to Student Practice Sheets</a></p></div><div id="app"></div></div><script src="./curriculum-data.js"></script><script>const d=window.SCHOOL_CURRICULUM;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const events=[...d.schoolEvents,...d.bookDates.map(x=>[x[0],x[1],x[2]])].sort((a,b)=>a[0].localeCompare(b[0]));const today=new Date().toISOString().slice(0,10);let week=d.weekMap.find(w=>today>=w.start)||d.weekMap[0];let list=d.spellingLists[week.spelling_list]||[];let review=[];for(let i=1;i<=10;i++){const prev=week.spelling_list-i;if(prev>0)review.push(d.spellingLists[prev][(i*3)%d.spellingLists[prev].length]);}app.innerHTML=`<div class="grid"><div class="card"><h2>Current week</h2><div class="pill">Week ${week.week}</div><div class="pill">Spelling List ${week.spelling_list}</div><p>${esc(d.mathPlan.practice_rotation[(week.week-1)%4])}</p><p class="muted">${esc(d.mathPlan.note)}</p></div><div class="card"><h2>Spelling</h2><p><b>30 new + 10 review</b> each week.</p><p>Pretest: Wednesday • Test: Friday when required • Dictation still required after a 100% pretest.</p><p class="muted">Select words from the supplied school lists; practice is not free-form.</p></div><div class="card"><h2>Poems</h2><p>Monthly memorization and recitation.</p></div></div><div class="card"><h2>List ${week.spelling_list} — New Words</h2><div>${list.map(w=>`<span class="word">${esc(w)}</span>`).join('')}</div><h3>10 Review Words</h3><div>${review.map(w=>`<span class="word">${esc(w)}</span>`).join('')}</div></div><div class="card"><h2>Year Calendar & Due Dates</h2>${events.map(e=>`<div style="padding:7px 0;border-top:1px solid #edf0f4"><b>${e[0]}</b> — ${esc(e[1])}</div>`).join('')}</div><div class="card"><h2>Poem Schedule</h2>${d.poems.map(p=>`<div style="padding:7px 0;border-top:1px solid #edf0f4"><b>${p[1]}</b> — ${esc(p[2])} <span class="muted">by ${esc(p[3])}</span></div>`).join('')}</div><div class="card"><h2>Math Practice Plan</h2><p>Source requirements:</p><ul>${d.mathPlan.source_requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>App practice rotation:</p><ul>${d.mathPlan.practice_rotation.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card"><h2>Spelling Rules</h2>${d.rules.map(r=>`<div style="padding:8px 0;border-top:1px solid #edf0f4"><b>Rule ${r[0]} — ${esc(r[1])}</b><div class="muted">${esc(r[2])}</div></div>`).join('')}</div>`;</script></body></html>
